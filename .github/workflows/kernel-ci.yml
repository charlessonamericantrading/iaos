name: kernel-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain (channel/components/target) comes from each crate's own
      # rust-toolchain.toml (both now list clippy+rustfmt too) - rustup
      # auto-installs it on first use, so this stays in sync with local
      # dev by construction instead of duplicating the pin here.
      - name: Lint agentos-kernel (fmt + clippy)
        working-directory: agentos-kernel
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

      - name: Lint kernel-runner (fmt + clippy)
        working-directory: kernel-runner
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

      - name: Build agentos-kernel
        working-directory: agentos-kernel
        run: cargo build --release

      # Separate host-target crate (its own rust-toolchain.toml) that
      # packages the kernel ELF into a bootable disk image via the
      # `bootloader` crate's DiskImageBuilder.
      - name: Build kernel-runner and package a bootable disk image
        working-directory: kernel-runner
        run: |
          cargo build --release
          ./target/release/kernel-runner \
            "../agentos-kernel/target/x86_64-unknown-none/release/agentos-kernel" \
            "../agentos-kernel/target/disk-image"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      # Boots headlessly and greps the serial log for milestones from
      # across every phase of the kernel (exceptions, PIC/interrupts, the
      # shell dispatcher, the cooperative and preemptive schedulers) - a
      # real smoke test, not just "did it compile". `|| true` on the qemu
      # invocation because `timeout` exits non-zero when it has to kill
      # the still-running kernel, which is the expected/healthy outcome
      # (the kernel's idle loop never exits on its own). 25s (not 15s) to
      # leave margin for the preemptive demo's ~2.7s real timer wait on
      # top of everything before it, especially on a possibly slower/
      # nested-virtualized CI runner than local dev hardware.
      - name: Boot-test in QEMU and verify the serial trace
        run: |
          timeout 25 qemu-system-x86_64 \
            -drive format=raw,file=agentos-kernel/target/disk-image/agentos-bios.img \
            -serial stdio -display none -no-reboot -no-shutdown \
            -device virtio-net-pci \
            | tee boot.log || true
          echo "----- full boot.log -----"
          cat boot.log
          echo "--------------------------"
          grep -q "AgentOS Native Bare-Metal Kernel Initialized" boot.log
          grep -q "\[IDT\] Native IDT Loaded" boot.log
          grep -q "\[EXCEPTION\] Breakpoint" boot.log
          grep -q "\[PIC\] 8259 remapped to vectors 32-47" boot.log
          # Confirms the global frame allocator hands out real, distinct,
          # genuinely writable/readable physical frames (verified=true is
          # only printed if all 3 write/read-back checks passed - a
          # mismatch would have panicked the boot instead). Not asserting
          # the exact addresses: they depend both on the bootloader's own
          # memory-map detection (could vary by QEMU/firmware version,
          # like Fase 19's BAR0 finding) and on how many earlier frames
          # the kernel image + heap already consumed (could vary by build
          # machine, like Fase 15's ELF-size finding) - so instead this
          # checks the one thing that's actually invariant: consecutive
          # allocate_frame() calls must return frames exactly 4 KiB apart,
          # which is a property of the allocator's own walk order, not of
          # where in physical memory it happens to start from.
          grep -q "FRAME ALLOC\].*verified=true" boot.log
          frame_line=$(grep "FRAME ALLOC\]" boot.log)
          mapfile -t frame_addrs < <(echo "$frame_line" | grep -oE "0x[0-9a-f]+")
          if [ "${#frame_addrs[@]}" -ne 3 ]; then
            echo "FRAME ALLOC REGRESSION: expected 3 addresses in '$frame_line', found ${#frame_addrs[@]}."
            exit 1
          fi
          if [ $(( ${frame_addrs[1]} - ${frame_addrs[0]} )) -ne 4096 ] || [ $(( ${frame_addrs[2]} - ${frame_addrs[1]} )) -ne 4096 ]; then
            echo "FRAME ALLOC REGRESSION: frames aren't consecutive 4 KiB apart: ${frame_addrs[*]}."
            exit 1
          fi
          # Confirms the GGUF header parser's input now genuinely round-trips
          # through the FAT12 disk (Fase 41) - create_file writes the same
          # 24-byte sample header to a real file, read_file reads it back,
          # and round_trip_ok=true means those bytes matched byte-for-byte -
          # not just that parse_header ran, which it always could on a
          # hardcoded array regardless of whether disk I/O worked at all.
          # Extended (Fase 42) to cover the tensor *weight values* too, and
          # again (Fase 43) to insert a real tensor-info entry (length-
          # prefixed name, dimensions, quantization type, and a byte OFFSET
          # to that tensor's own data) between the header and the weight
          # bytes. tensor_info_ok=true means the parsed name/dimensions/
          # gtype/offset all match what was actually written - not just
          # that GgufTensorInfo::parse ran without erroring. weights_
          # decoded_ok=true means decode_f32_le, given the bytes at that
          # PARSED offset (not an assumed fixed position), reproduced the
          # exact original values - the real proof the offset-based
          # indirection works, not just parses. tensor_output_ok=true means
          # running the matmul on those offset-located, disk-decoded
          # weights produces the same known-correct result the original
          # hardcoded array always did.
          grep -q "GGUF\] disk_load_test write_ok=true round_trip_ok=true tensor_info_ok=true weights_decoded_ok=true tensor_output_ok=true cleanup_ok=true" boot.log
          # Confirms real GGUF Q8_0 quantized tensor decoding (Fase 50) -
          # pure byte-transformation logic, deliberately disk-independent.
          # f16_vectors_ok is hand-computed (bit patterns 0x3C00/0xC000/
          # 0x0000/0x0001 -> 1.0/-2.0/0.0/the smallest binary16 subnormal),
          # independent of decode_q8_0's own round trip - a round-trip-
          # only test would still pass even if f16_to_f32 consistently
          # disagreed with the real IEEE 754 standard. dispatch_*_ok prove
          # decode_tensor actually branches on a tensor's gtype (F32,
          # Q8_0, and an honest Err for an unimplemented one) rather than
          # silently assuming everything is F32, the real gap this Fase
          # closes.
          grep -q "GGUF\] q8_0_test f16_vectors_ok=true q8_0_decode_ok=true dispatch_f32_ok=true dispatch_q8_0_ok=true" boot.log
          # Confirms real GGUF Q4_0 quantized tensor decoding (Fase 52) -
          # 4-bit, nibble-packed. The self-test's block uses a
          # deliberately asymmetric nibble pattern (low nibble ascending,
          # high nibble descending) specifically so a low/high-nibble
          # swap OR an interleaved-vs-split-half packing bug (byte j's
          # nibbles are value[j]/value[j+16], NOT value[2j]/value[2j+1] -
          # verified against GGML's actual dequantize_row_q4_0 source)
          # would produce a completely different, easily-distinguishable
          # wrong sequence rather than accidentally passing.
          # dispatch_q4_0_ok confirms decode_tensor (Fase 50) now routes
          # Q4_0 to this new decoder too.
          grep -q "GGUF\] q4_0_test q4_0_decode_ok=true dispatch_q4_0_ok=true" boot.log
          # Confirms real GGUF Q4_1 quantized tensor decoding (Fase 53) -
          # closes out the legacy quantization thread (every GgufGtype
          # except F16 now has a real decoder). Same split-half nibble
          # packing as Q4_0, verified to genuinely carry over via GGML's
          # actual dequantize_row_q4_1 source, but a full affine
          # nibble*scale+min dequantization instead of Q4_0's fixed
          # symmetric range. scale=0.5/min=1.0 are deliberately distinct
          # nonzero values so a bug conflating or dropping either field
          # produces visibly wrong output, combined with the same
          # asymmetric nibble pattern Q4_0's own test uses.
          grep -q "GGUF\] q4_1_test q4_1_decode_ok=true dispatch_q4_1_ok=true" boot.log
          # Confirms real GGUF Q4_K super-block decoding (Fase 57) - a
          # 144-byte block holding 256 values across 8 sub-blocks, each
          # with its own 6-bit-packed scale+min (get_scale_min_k4).
          # get_scale_min_k4_ok re-runs a hand-derived-and-verified round
          # trip (an early research fetch of this struct's field sizes
          # was wrong - scales[8]/qs[64] instead of the real scales[12]/
          # qs[128] - so this function's own bit-packing was independently
          # hand-checked, not just re-fetched and trusted). decode_q4_k_ok
          # checks all 256 decoded values (4 distinct 32-byte qs chunks)
          # against 8 hand-computed constants covering every sub-block.
          # Confirms real GGUF Q3_K super-block decoding (Fase 60) - the
          # fourth K-quant format, structurally the most intricate yet:
          # 16 sub-blocks of 16 elements (not 8 of 32), a signed 3-bit
          # value (2 bits from qs + 1 bit from hmask, recentered -4),
          # and a scale-reconstruction scheme that is NOT get_scale_
          # min_k4 (no separate min field - GGML treats scales[12] as
          # three u32 words and SWAR-reconstructs a fourth). The
          # reduced per-index formula was cross-checked by re-
          # implementing GGML's exact packed-word logic in a scratch
          # script across 2000 random byte inputs before any Rust was
          # written - the full value-extraction loop was verified the
          # same way, not just hand arithmetic.
          # Confirms real GGUF Q2_K super-block decoding (Fase 61) - the
          # fifth K-quant format, and the simplest of the intricate
          # K-quant family: each scales[16] byte holds both a scale
          # (low nibble) and min (high nibble) directly, no bit-packing
          # to derive. The plain 2-bit value (unsigned, no recentering)
          # is dequantized affinely - the outer n/j/is/shift loop is
          # structurally identical to Q3_K's own. Verified via the same
          # scratch-script cross-check Q3_K introduced (16 distinct
          # scale/min pairs, spanning the full nibble range) before any
          # Rust was written. Likely completes the real, model-storage
          # K-quant family (Q2_K through Q6_K) - only Q8_K remains, an
          # internal computation format rather than a storage one.
          grep -q "GGUF\] q2_k_test decode_q2_k_ok=true dispatch_q2_k_ok=true" boot.log
          grep -q "GGUF\] q3_k_test decode_q3_k_ok=true dispatch_q3_k_ok=true" boot.log
          grep -q "GGUF\] q4_k_test get_scale_min_k4_ok=true decode_q4_k_ok=true dispatch_q4_k_ok=true" boot.log
          # Confirms real GGUF Q6_K super-block decoding (Fase 58) - a
          # 210-byte block (ql[128]+qh[64]+scales[16]+d, d LAST unlike
          # every format above) holding 256 values whose 6-bit quantized
          # value is split across TWO arrays (ql low nibble, qh 2-bit
          # field) rather than one nibble-pair array, with plain signed
          # i8 sub-block scales (no bit-packing, unlike Q4_K's scales).
          # decode_q6_k_ok checks all 256 decoded values from a uniform
          # ql/qh byte pattern against 8 distinct prime-scaled hand-
          # computed constants, exercising both branches of the sub-
          # block scale index for all four bit-extracted quadrants.
          grep -q "GGUF\] q6_k_test decode_q6_k_ok=true dispatch_q6_k_ok=true" boot.log
          # Confirms real GGUF Q5_K super-block decoding (Fase 59) - a
          # third K-quant format, structurally close to Q4_K (d/dmin
          # first, scales[12] 6-bit-packed via the SAME get_scale_min_k4
          # Q4_K already uses, unchanged). The new piece: a 5th bit per
          # value from qh[32] (added as +16 to a 4-bit qs nibble), with
          # qh itself never advancing - shifting bit-masks pick a
          # different single bit position out of the same 32 bytes each
          # of the block's 4 sub-iterations. decode_q5_k_ok reuses Fase
          # 57's own already-verified scale/min constants unchanged,
          # checked against 8 hand-computed dequantized values from a
          # uniform qh/qs byte pattern.
          grep -q "GGUF\] q5_k_test decode_q5_k_ok=true dispatch_q5_k_ok=true" boot.log
          # Confirms real GGUF F16 tensor decoding (Fase 54) - the last
          # GgufGtype, completing full decode_tensor coverage. Unlike the
          # quantized formats above, F16 has no block/scale structure at
          # all - each value is simply its own raw 2 bytes via the
          # already-verified f16_to_f32, reused directly rather than
          # duplicated.
          grep -q "GGUF\] f16_test f16_decode_ok=true dispatch_f16_ok=true" boot.log
          # Confirms real GGUF multi-tensor-info support (Fase 51) -
          # GgufTensorInfo::parse_many, generalizing tensor-info parsing
          # to any real number of tensors instead of just one.
          # parse_many_ok checks both constructed entries' name/
          # dimensions/gtype/offset are exactly right AND that the total
          # bytes consumed lands exactly at the tensor-info section's own
          # end - proof each entry's own length was tracked correctly
          # across the whole sequence, not just the first one.
          # tensor1/2_decode_ok feed each parsed entry's OWN gtype
          # (deliberately different: F32 and Q8_0) into decode_tensor
          # (Fase 50) - proof parse_many's real output is directly usable
          # by decode_tensor, not just structurally similar to what it
          # expects.
          grep -q "GGUF\] multi_tensor_test parse_many_ok=true tensor1_decode_ok=true tensor2_decode_ok=true" boot.log
          # Confirms GgufTensorInfo::parse_many now works through REAL
          # FAT12 disk I/O (Fase 56), not just the synthetic in-memory
          # buffer the check above uses - the exact gap Fase 51's own
          # notes flagged as unclosed. A genuine 2-tensor GGUF file
          # (different gtypes again: F32 + Q8_0) is written to its own
          # dedicated file, read back, and both tensors are parsed AND
          # decoded from the disk-read bytes - each tensor's offset is
          # relative to the full file, matching the original single-
          # tensor disk-load test's own established convention.
          # cleanup_ok confirms this is fully self-cleaning, same
          # discipline as every other dedicated-file FAT12 test.
          grep -q "GGUF\] multi_tensor_disk_test write_ok=true round_trip_ok=true header_ok=true parse_many_disk_ok=true tensor1_disk_decode_ok=true tensor2_disk_decode_ok=true cleanup_ok=true" boot.log
          # Confirms SYS_TENSOR_EVAL (Fase 55) genuinely dispatches to the
          # real tensor engine now, not "Unknown System Call Number" (this
          # syscall number had been defined but never wired to any match
          # arm at all before this Fase). syscall_ok proves the real
          # success code (0) came back, not the u64::MAX fallback.
          # tensor_eval_correct proves the actual computed 2x2 layer
          # output matches hand-computed values exactly - including
          # ReLU's clipping branch on row 1's deliberately negative
          # pre-activation - not just that some output happened to be 0.
          grep -q "SYSCALL\] tensor_eval_test syscall_ok=true tensor_eval_correct=true outputs=\[4.00, 0.00\]" boot.log
          grep -q "SHELL\] ps ->" boot.log
          # Confirms the `date` command reads a real, plausible wall-clock
          # value from the CMOS RTC. Can't assert an exact date/time here -
          # it's genuinely real time, different on every run by design -
          # so this checks structure (well-formed YYYY-MM-DD HH:MM:SS) and
          # a wide plausibility band on the year, which is enough to catch
          # a broken BCD/binary conversion (e.g. reading BCD 0x26 as
          # decimal 38 would put the year in the 8000s) without needing to
          # know the actual date.
          if ! grep -qE "SHELL\] date -> [0-9]{4}-[0-9]{2}-[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}" boot.log; then
            echo "RTC REGRESSION: 'date' output isn't well-formed YYYY-MM-DD HH:MM:SS."
            exit 1
          fi
          rtc_year=$(grep -oE "SHELL\] date -> [0-9]{4}" boot.log | grep -oE "[0-9]{4}$")
          if [ "$rtc_year" -lt 2020 ] || [ "$rtc_year" -gt 2099 ]; then
            echo "RTC REGRESSION: year $rtc_year isn't plausible - BCD/binary conversion likely broken."
            exit 1
          fi
          # Confirms cursor movement really works, not just that it
          # compiles: typing "hep", pressing Left once, then typing "l"
          # should insert at the cursor (between 'e' and 'p') and dispatch
          # the real `help` command - so "help ->" must appear a SECOND
          # time (the first is the earlier, separate help self-test).
          # Landing on "hepl" (append-only bug) or "lhep" (wrong insert
          # index) would both fail this - only the cursor genuinely being
          # between 'e' and 'p' produces exactly "help".
          if [ "$(grep -c 'SHELL\] help ->' boot.log)" -ne 2 ]; then
            echo "CURSOR REGRESSION: expected exactly 2 'help ->' dispatches (self-test + cursor-movement test), got $(grep -c 'SHELL\] help ->' boot.log)."
            exit 1
          fi
          # Confirms Shift key support really works: typing "cat KERNEL~1"
          # via a real scancode sequence (holding Shift across "KERNEL~",
          # releasing before the unshifted "1") must dispatch the exact
          # same real command a second time (the first is the direct
          # self-test earlier) - so "cat KERNEL~1 ->" should appear twice,
          # both times with the identical byte count. Not asserting the
          # specific byte count itself (KERNEL~1's size shifts by build
          # machine, same lesson as Fase 15) - only that whatever it is,
          # both dispatches agree, proving the Shift-typed filename was
          # exactly right, not almost right.
          cat_byte_counts=$(grep -oE "SHELL\] cat KERNEL~1 -> [0-9]+ bytes" boot.log | grep -oE "[0-9]+ bytes" | grep -oE "^[0-9]+")
          cat_dispatch_count=$(echo "$cat_byte_counts" | grep -c .)
          if [ "$cat_dispatch_count" -ne 2 ]; then
            echo "SHIFT KEY REGRESSION: expected 'cat KERNEL~1' dispatched exactly twice (direct self-test + Shift-driven keyboard test), got $cat_dispatch_count."
            exit 1
          fi
          if [ "$(echo "$cat_byte_counts" | head -1)" != "$(echo "$cat_byte_counts" | tail -1)" ]; then
            echo "SHIFT KEY REGRESSION: the two 'cat KERNEL~1' dispatches read different byte counts - the Shift-driven filename was likely typed wrong."
            exit 1
          fi
          grep -q "\[CTXSWITCH\] worker -> main: demo OK" boot.log
          grep -q "\[COOP\] all tasks finished" boot.log
          # Confirms the ps-visible PCB table is really unified with the
          # cooperative scheduler now, not just two disjoint task tables
          # that happen to both exist. Mid-demo: task-alpha (spawned first,
          # highest priority) must already be RUNNING with a real stack
          # pointer at the exact point it dispatches `ps` on itself, while
          # its not-yet-scheduled siblings still show the PCB default of
          # rsp=0x0 - proving ps reflects live state, not a fixed table.
          # Deliberately NOT asserting the exact rsp value here (same
          # lesson as the FAT12 byte-count fix above): only that it starts
          # with the heap's address prefix, since the precise byte offset
          # can shift a little depending on what got allocated earlier in
          # boot on a given machine. 0x444444 is guaranteed to prefix any
          # real address in this kernel's whole 1 MiB heap range
          # (0x444444440000..0x444444540000, see memory/heap.rs).
          grep -q "PID 5 \[HIGH\] RUNNING task-alpha rsp=0x444444" boot.log
          grep -q "task-bravo rsp=0x0" boot.log
          grep -q "task-charlie rsp=0x0" boot.log
          # After the demo: all three really terminated (not just stopped
          # existing), each with a distinct real stack pointer recorded -
          # proof the PCB updates kept firing through to the very end.
          grep -q "PID 5 \[HIGH\] DEAD task-alpha rsp=0x444444" boot.log
          grep -q "PID 6 \[NORM\] DEAD task-bravo rsp=0x444444" boot.log
          grep -q "PID 7 \[BG\] DEAD task-charlie rsp=0x444444" boot.log
          grep -q "\[PREEMPT\] task0=" boot.log
          # Regression guard for the exact bug this demo caught locally:
          # both counters at exactly 0 means the timer-forced switches
          # never really happened (e.g. a non-atomic flag/counter got
          # optimized away again), not that preemption is merely slow.
          if grep -q "\[PREEMPT\] task0=0 task1=0" boot.log; then
            echo "PREEMPT REGRESSION: both counters are zero - neither task ever ran."
            exit 1
          fi
          # Same ps/PCB-unification proof as the cooperative scheduler
          # above, now for the preemptive one - this is the part that
          # needed tick() (interrupt context) to use SCHEDULER.try_lock(),
          # never the blocking .lock(), so it's also an indirect regression
          # guard for that: if try_lock were ever swapped back to a
          # blocking lock and a normal-context caller got unlucky enough to
          # be mid-update when the timer fired, this whole boot would hang
          # instead of reaching these lines. Same address-prefix-only
          # policy as above for the same reason (Fase 15's lesson).
          grep -q "PID 8 \[NORM\] RUNNING preempt-task-0 rsp=0x444444" boot.log
          grep -q "preempt-task-1 rsp=0x0" boot.log
          grep -q "PID 8 \[NORM\] DEAD preempt-task-0 rsp=0x444444" boot.log
          grep -q "PID 9 \[NORM\] DEAD preempt-task-1 rsp=0x444444" boot.log
          # device=0x1237 is the real i440FX host bridge's device ID -
          # always present at 00:00.0 on QEMU's default machine, so this
          # confirms PCI config-space reads are actually correct, not just
          # that the lspci command ran without crashing.
          grep -q "device=0x1237" boot.log
          # Confirms real e1000 NIC MMIO access, not just PCI config-space
          # enumeration. First attempt at this check also pinned the exact
          # BAR0 address (0xfebc0000 locally) - failed on the CI runner's
          # QEMU, which assigned 0xfeb80000 instead from the identical
          # source (SeaBIOS's PCI resource allocation apparently isn't
          # pinned across QEMU versions the way the device's own emulated
          # register *contents* are). So: don't assert the exact BAR0
          # value, only that a real one was found and read through. The
          # MAC/STATUS values, by contrast, matched exactly on both QEMU
          # versions - they're the e1000 device model's own hardcoded
          # emulation defaults, unrelated to bus enumeration, so those
          # stay pinned exactly: 52:54:00:12:34:56 is QEMU's well-known
          # default NIC MAC (the exact value this project's own
          # now-superseded-by-this virtio_net.rs placeholder had
          # hardcoded, coincidentally) - reading it back for real, through
          # actual MMIO, is the strongest evidence available that this
          # genuinely reached hardware rather than garbage.
          grep -q "E1000\] found 00:03.0 bar0=0x" boot.log
          grep -q "mac=52:54:00:12:34:56 valid=true" boot.log
          # Confirms real VirtIO-net PCI access (Fase 62) - a second,
          # structurally different real NIC alongside e1000, reachable
          # because the boot command above now adds `-device virtio-
          # net-pci` (confirmed empirically to land at a NEW PCI slot,
          # 00:04.0, leaving e1000's 00:03.0 completely unaffected - the
          # two e1000 checks immediately above this one are unchanged).
          # Unlike e1000's memory-mapped BAR0, VirtIO's legacy PCI
          # transport uses an I/O-port BAR0 (confirmed by checking BAR0
          # bit 0) - real in/out port reads, not read_volatile through a
          # mapped address. mac_feature=true confirms VIRTIO_NET_F_MAC
          # is set in the real features bitmask read back; the exact MAC
          # (52:54:00:12:34:57, one past e1000's own 52:54:00:12:34:56)
          # is QEMU's own default per-NIC MAC-assignment scheme for this
          # exact device list - a fixed property of the emulated
          # hardware/boot-command combination, the same "safe to pin
          # exactly" class as e1000's own MAC check above, not something
          # environment-dependent like a BAR0 address or binary size.
          grep -q "VIRTIO\] found 00:04.0 bar0=0x" boot.log
          grep -q "mac_feature=true mac=52:54:00:12:34:57" boot.log
          # Confirms the real VirtIO device-init handshake (Fase 63) -
          # ACKNOWLEDGE -> DRIVER -> DRIVER_OK - and setup of one real
          # virtqueue (TX, index 1). queue_num=256 is read back from
          # the device, not assumed, and needs a 3-frame (10246-byte)
          # contiguous physical allocation - the first thing in this
          # kernel to actually need multi-frame contiguity (checked
          # explicitly, not assumed, in allocate_contiguous_frames).
          # pfn_ok=true is the real proof: the device's own QUEUE_PFN
          # register reads back exactly what was written, not just that
          # the write didn't crash. final_status=0x07 confirms the full
          # ACKNOWLEDGE|DRIVER|DRIVER_OK handshake stuck.
          grep -q "VIRTIO\] txq_test queue_num=256 frames_needed=3 pfn_ok=true final_status=0x07" boot.log
          # Confirms a real, complete VirtIO TX send (Fase 64) - builds
          # a virtio_net_hdr+frame, places a descriptor in the avail
          # ring, notifies the device, and the used ring genuinely
          # advances (advanced=true), proving the device actually
          # processed it via DMA. Hit and fixed the exact same class of
          # bug net::e1000 needed until its own Fase 44 to resolve
          # (PciDevice::enable_bus_mastering was never called) - caught
          # in one re-test this time, not a multi-Fase investigation,
          # specifically because this kernel's own prior history named
          # the hypothesis directly. elem_len=0 is correct and expected
          # for a TX completion (the device only ever reads a TX
          # buffer, never writes back into it).
          grep -q "VIRTIO\] tx_test used_idx_before=0 used_idx_after=1 advanced=true elem_id=0 elem_len=0" boot.log
          # Confirms RX virtqueue setup + descriptor arming (Fase 65) -
          # the RX equivalent of the txq_test line above, same two-step
          # shape TX itself took (Fase 63 ring setup, Fase 64 real
          # send). Called AFTER DRIVER_OK was already set by the TX
          # handshake above, deliberately without re-touching STATUS -
          # pfn_ok=true is real, empirical proof this queue's memory
          # was still accepted by the device even though DRIVER_OK
          # already applied before this queue existed, not merely
          # assumed spec-compliant. desc_write_flag_ok=true confirms
          # the one genuinely new piece beyond every prior descriptor
          # this kernel has written: VRING_DESC_F_WRITE (2, confirmed
          # against the Linux kernel's own real virtio_ring.h) marks
          # this buffer for the DEVICE to write INTO, the opposite
          # direction from TX's own read-only descriptors.
          # avail_idx_after=1 confirms the ring publish succeeded. Does
          # NOT yet trigger or observe a real received frame - that is
          # separate, substantial follow-on work.
          grep -q "VIRTIO\] rxq_test queue_num=256 frames_needed=3 pfn_ok=true desc_write_flag_ok=true avail_idx_after=1" boot.log
          # e1000 TX (Fase 22, fully confirmed working Fase 44) - the ring
          # genuinely engages the hardware (TDH advances) AND the
          # descriptor's DD status bit now gets written back too, since
          # PciDevice::enable_bus_mastering finally enables the one real
          # PCI bring-up step (Bus Master Enable) this driver had never
          # performed - see net/e1000.rs's module doc for the two-round
          # investigation and its actual resolution. dd=true is the
          # strongest possible check here: not just that the bounded poll
          # completed and control returned to main.rs, but that the
          # hardware's own completion signal genuinely arrived.
          grep -q "E1000\] tx_sent 42 bytes dd=true" boot.log
          # Confirms real e1000 RX (Fase 45) - receive_test_frame arms a
          # real receive descriptor ring, triggers the TX ARP request
          # above, and QEMU's SLIRP backend genuinely replies. is_arp_
          # reply=true is the strongest check here: it means the ARP
          # OPER field reads 0x0002 (reply, not request) AND the Sender
          # Hardware Address matches the Ethernet source MAC - real
          # internal cross-consistency a malformed or coincidental frame
          # wouldn't have, not just that 64 bytes of *something* arrived.
          # gateway_ip matching exactly the IP the original request asked
          # about is the final, independent confirmation this is a real,
          # correctly-addressed reply from the network, not noise.
          grep -q "E1000\] rx_received 64 bytes eop=true is_arp_reply=true gateway_ip=Some(\[10, 0, 2, 2\])" boot.log
          # Confirms the new `netcheck` shell command (Fase 46) reaches
          # the same already-proven TX+RX round trip through the real
          # dispatch_command parsing path, not just the direct API call
          # above - the same "prove the API, then prove the shell path"
          # pattern this session used for FAT12's own commands.
          grep -q "SHELL\] netcheck -> ok" boot.log
          # Confirms the new IPv4 + ICMP protocol layer (Fase 47, net::icmp)
          # is correct in isolation - pure byte-buffer construction/parsing,
          # deliberately not yet wired to the NIC. checksum_even_case_ok/
          # checksum_odd_case_ok are hand-computed vectors independent of
          # any round-trip self-consistency - the real bug this Fase's own
          # verification caught (comparing a re-summed checksum against the
          # wrong constant, 0xFFFF instead of 0x0000, since this code's
          # internet_checksum already returns the one's-complement value)
          # would NOT have been caught by a round-trip test alone, since
          # both sides of a round trip agree with each other regardless.
          # request_fields_ok/reply_fields_ok round-trip a full echo message
          # through build_icmp_echo -> parse_icmp_echo (odd-length end to
          # end, exercising the checksum's odd-byte-padding path in the
          # full integration path too); corrupted_checksum_rejected is the
          # proof this isn't a rubber stamp (one payload byte XOR-flipped
          # after building a valid message must now be rejected);
          # ipv4_checksum_valid confirms the separate IPv4 header checksum
          # the same way. All six checks must be true for this exact line
          # to appear.
          grep -q "ICMP\] ping_selftest checksum_even_case_ok=true checksum_odd_case_ok=true request_fields_ok=true reply_fields_ok=true corrupted_checksum_rejected=true ipv4_checksum_valid=true" boot.log
          # Confirms generalized ARP resolution (Fase 48, net::e1000::
          # arp_resolve) - a new, independent function (does not touch
          # send_test_frame/receive_test_frame, whose exact log output is
          # asserted above) that resolves an arbitrary target IP's MAC via
          # a real TX+RX round trip, instead of only ever asking about
          # SLIRP's hardcoded gateway. Asserts the EXACT expected MAC
          # (52:55:0a:00:02:02) - safe to pin exactly, since it's SLIRP's
          # own fixed virtual gateway MAC, already observed as the
          # replying device's source address in the rx_received check
          # above (a property of the emulated backend itself, not this
          # build/environment - the same "safe to pin" class as the e1000
          # NIC's own hardcoded default MAC, per the Fase 15/19 CI-
          # portability lesson).
          grep -q "E1000\] arp_resolve_test target=10.0.2.2 mac=\[52, 55, 0a, 00, 02, 02\] matches_known_gateway_mac=true" boot.log
          # Confirms a real, complete ping (Fase 49, net::e1000::ping) -
          # the convergence of arp_resolve (Fase 48) and net::icmp (Fase
          # 47) into the first full, real, routable IP packet this kernel
          # has ever sent. reply=true means a genuine ICMP echo reply was
          # parsed and verified (EtherType IPv4, IPv4 protocol ICMP with a
          # valid header checksum, source matching the pinged host, and an
          # ICMP echo reply - not request - whose identifier/sequence
          # match what was sent) - not just that something arrived.
          # Deliberately NOT asserting the exact rtt_ticks value: real
          # timing could plausibly differ on the CI runner's environment,
          # the same portability lesson Fase 15/19 already established for
          # other environment-dependent numbers. Expected exactly twice -
          # the direct self-test call and the `ping` shell command
          # (Fase 49) reaching the identical underlying function through
          # the real dispatch_command parsing path, same "prove the API,
          # then prove the shell path" pattern as netcheck (Fase 46).
          if [ "$(grep -c 'E1000\] ping target=\[10, 0, 2, 2\] reply=true' boot.log)" -ne 2 ]; then
            echo "PING REGRESSION: expected exactly 2 successful ping replies (direct + shell), got $(grep -c 'E1000\] ping target=\[10, 0, 2, 2\] reply=true' boot.log)."
            exit 1
          fi
          grep -q "SHELL\] ping 10.0.2.2 -> ok" boot.log
          # Confirms the new ATA write path (Fase 23) genuinely wrote and
          # read back matching bytes - not just that write_sector()
          # returned without erroring. Deliberately NOT asserting the
          # exact LBA tested: it's partition.start_lba + 3000, and
          # partition1 sits immediately after partition0 in the MBR, so
          # its start could in principle shift if partition0's size ever
          # varies by build machine (the same class of risk Fase 15 hit
          # with file sizes) - only the match=true outcome is asserted.
          grep -qE "ATA\] write_test lba=[0-9]+ match=true" boot.log
          # Confirms the FAT12 write test (Fase 24) both wrote real bytes
          # that read back correctly AND genuinely restored the original
          # content afterward - the second half matters as much as the
          # first: BOOT-S~1/BOOT-S~2 are the bootloader crate's own
          # boot-stage executables, not inert data, and leaving the test
          # pattern in place would corrupt the boot chain for whatever
          # boots this exact disk image next (found the hard way locally
          # - see README's FAT32/FAT12 row). A missing "restored=true"
          # here would mean this CI run's own image is now corrupted,
          # even though this run itself already captured its full log.
          grep -qE "FAT12\] write_test file=BOOT-S~2 len=[0-9]+ match=true" boot.log
          grep -q "FAT12\] write_test restored=true" boot.log
          # Confirms real FAT12 file CREATION (Fase 26) - a genuinely new
          # file, not an overwrite. Unlike KERNEL~1's size, the test
          # content here is a fixed byte-string literal
          # (`b"AgentOS created this file for real."`), so its 35-byte
          # length is a true compile-time constant on any build machine -
          # safe to assert exactly, unlike file sizes that depend on the
          # whole compiled kernel binary. A fresh CI image always creates
          # this file for the first time (never "already exists" - that
          # path only shows up on a local repeat boot against the same
          # unregenerated image), so created=true is the only outcome a
          # CI run should ever see.
          grep -q "FAT12\] create_test created=true" boot.log
          grep -q "FAT12\] create_test read_back_len=35 match=true" boot.log
          grep -q "SHELL\] ls -> FAT12/16 4 entries" boot.log
          grep -q "AGENTOS.TXT 35 bytes" boot.log
          # Confirms real FAT12 file DELETION (Fase 27) - both fields matter:
          # existed_before=true proves DELETEME.TXT was genuinely there first
          # (this test creates it itself, right before deleting it), and
          # gone_after=true proves read_file can no longer find it - not just
          # that delete_file() returned Ok. A fresh CI image always creates
          # this file for the first time and always deletes it successfully
          # (the "already exists"/failure paths only show up on a local
          # repeat boot against an image where a previous delete failed), so
          # this exact line is the only outcome a CI run should ever see.
          # This test caught a real stale-cache bug locally: write_fat_entry
          # _to_disk wrote the new FAT value to disk but never updated the
          # in-memory fat_bytes copy, so delete_file's cluster-chain walk
          # (next_cluster) saw the cluster's old, pre-creation value and
          # failed with "hit a free (0) entry unexpectedly" - see README's
          # new FAT12 file deletion row for the full story.
          grep -q "FAT12\] delete_test existed_before=true gone_after=true" boot.log
          # Confirms touch/rm (Fase 28) work through the REAL dispatch_command
          # parsing path, not just by calling Fat12Info's create_file/
          # delete_file directly the way the tests above do - before this,
          # create_file/delete_file existed but nothing let a real person at
          # the AgentOS> prompt actually reach them. The test content is a
          # fixed literal ("hello from the real shell") re-joined with
          # single spaces by touch's arg-parsing, so its 25-byte length and
          # first 4 bytes are genuine compile-time constants, same
          # reasoning as the AGENTOS.TXT check above - safe to assert
          # exactly, unlike file sizes that depend on the compiled kernel.
          grep -q "SHELL\] touch SHELLNEW.TXT -> created 25 bytes" boot.log
          grep -q "SHELL\] cat SHELLNEW.TXT -> 25 bytes" boot.log
          grep -q "first4=68656c6c" boot.log
          grep -q "SHELL\] rm SHELLNEW.TXT -> deleted" boot.log
          grep -q "SHELL\] cat SHELLNEW.TXT -> FAILED: FAT12: file not found in root directory" boot.log
          # Confirms FAT12 MULTI-CLUSTER file creation (Fase 29) - create_file
          # previously only handled files fitting in a single cluster; this
          # forces several clusters to be allocated, written, and chained
          # together (3100 bytes needs 4 clusters on this disk's measured
          # 1024-byte cluster size, though the exact count isn't asserted
          # here, only match=true is - the number of clusters needed could
          # in principle differ on another build's disk geometry). The test
          # content is a fixed deterministic pattern, so 3100 is a genuine
          # compile-time constant, safe to assert exactly. match=true means
          # every one of those 3100 bytes round-tripped correctly, not just
          # that the length matched. This also doubles as the first real
          # test of delete_file's cluster-chain walk against an actual
          # multi-cluster chain (Fase 27 only ever exercised it against
          # single-cluster files) - gone=true confirms every cluster in a
          # real multi-cluster chain got freed correctly, not just the first.
          grep -q "FAT12\] multi_cluster_test created=true read_back_len=3100 match=true" boot.log
          grep -q "FAT12\] multi_cluster_test deleted=true gone=true" boot.log
          # Confirms FAT12 file RESIZE (Fase 30) - write_file previously only
          # supported same-size overwrites; this takes one file through
          # create (500 bytes) -> grow (2500, needing 2 genuinely NEW
          # clusters chained on) -> shrink (300, freeing those same 2
          # clusters back to the FAT), each phase checked against a
          # DIFFERENT deterministic pattern so stale bytes left over from
          # an earlier phase would show up as a mismatch, not an
          # accidental pass. All three sizes are fixed literals in source,
          # so this exact line is safe to assert - a fresh CI image always
          # takes this same path (grow/shrink don't depend on anything
          # machine-specific, unlike e.g. PCI BAR addresses).
          grep -q "FAT12\] resize_test created_ok=true grow_ok=true shrink_ok=true" boot.log
          grep -q "FAT12\] resize_test cleanup deleted=true gone=true" boot.log
          # Confirms FAT12 SUBDIRECTORY creation+listing (Fase 31) - mkdir
          # allocates a real cluster holding "." and ".." entries (the real
          # FAT convention), distinct from a plain file's opaque-data
          # cluster. A fresh CI image always creates TESTDIR for the first
          # time (never "already exists" - that path only shows up on a
          # local repeat boot, same reasoning as every other create-type
          # check this session), so created=true is the only outcome CI
          # should see. The entries=2 count matters more: it's the proof
          # that create_directory's explicit zeroing of the rest of the new
          # cluster worked - this kernel's own self-tests create-then-
          # delete several files every boot, so a freshly-allocated
          # cluster could easily still hold stale directory-entry-shaped
          # bytes from one of them if that zeroing were missing or wrong,
          # which would inflate this count above 2.
          grep -q "SHELL\] mkdir TESTDIR -> created" boot.log
          grep -q "SHELL\] ls TESTDIR -> 2 entries" boot.log
          # Confirms FAT12 SUBDIRECTORY deletion (Fase 33) - rmdir frees the
          # directory's cluster and marks its root entry deleted, same
          # mechanics delete_file already uses. Uses its own dedicated,
          # fully self-cleaning directory (RMDTEST) rather than TESTDIR
          # above (which deliberately stays around to keep testing mkdir's
          # "already exists" tolerance) - a fresh CI image always creates
          # then deletes RMDTEST successfully, so these exact lines are the
          # only outcome CI should ever see.
          grep -q "SHELL\] mkdir RMDTEST -> created" boot.log
          grep -q "SHELL\] rmdir RMDTEST -> deleted" boot.log
          # Confirms FAT12 file I/O INSIDE A SUBDIRECTORY (Fase 34) - the
          # biggest remaining gap from Fase 31: create_file/read_file/
          # write_file/delete_file previously only ever operated on the
          # root. The new _in variants share the exact same internal logic
          # via a DirLocation abstraction, so this test exercises create,
          # a real multi-cluster grow via write_file_in (1500 bytes),
          # delete, and cleanup (deleting the now-empty test directory
          # itself) all inside a subdirectory - all four must succeed for
          # this exact line to appear, so it's a strong single assertion.
          # A fresh CI image always takes this same fully-self-cleaning
          # path (analogous to RMDTEST above), so this is the only outcome
          # CI should ever see.
          grep -q "FAT12\] subdir_file_test created_ok=true write_ok=true delete_ok=true cleanup_ok=true" boot.log
          # Confirms shell-level DIR/FILE path support (Fase 35) - touch/
          # cat/rm now understand "DIRNAME/FILENAME.EXT" (one level deep),
          # reaching a subdirectory's file through the REAL dispatch_command
          # parsing path (split_path + resolve_dir_cluster), not by calling
          # Fat12Info's *_in methods directly the way the test above does.
          # The final cat correctly asserts the SUBDIRECTORY-specific
          # "not found in directory" message (not "in root directory") -
          # proof the path genuinely routed to the right place, not a
          # coincidental pass. Test content is a fixed literal, so the
          # 21-byte length and first-4-bytes hex are safe to assert exactly,
          # same reasoning as every other fixed-literal-content check.
          # Fully self-cleaning, so this is the only outcome a fresh CI
          # image should ever see.
          grep -q "SHELL\] mkdir PATHTEST -> created" boot.log
          grep -q "SHELL\] touch PATHTEST/INSIDE.TXT -> created 21 bytes" boot.log
          grep -q "SHELL\] cat PATHTEST/INSIDE.TXT -> 21 bytes" boot.log
          grep -q "SHELL\] rm PATHTEST/INSIDE.TXT -> deleted" boot.log
          grep -q "SHELL\] cat PATHTEST/INSIDE.TXT -> FAILED: FAT12: file not found in directory" boot.log
          grep -q "SHELL\] rmdir PATHTEST -> deleted" boot.log
          # Confirms NESTED FAT12 subdirectories (Fase 36) - create_directory/
          # delete_directory now accept a parent directory location, same
          # DirLocation pattern as the file-I/O generalization above. The
          # real correctness check here is dotdot_ok specifically: a nested
          # directory's ".." entry must point to its PARENT's real cluster,
          # not always 0 (0 is only valid when the parent is root) - a bug
          # here would leave dotdot_ok=false while everything else still
          # reported success, so this is exactly the kind of subtle
          # regression a less specific check could miss. All four checks
          # must succeed for this exact line to appear, so it's a strong
          # single assertion; a fresh CI image always takes this same
          # fully-self-cleaning path.
          grep -q "FAT12\] nested_dir_test outer_count_ok=true dotdot_ok=true delete_inner_ok=true cleanup_ok=true" boot.log
          # Confirms FAT12 SUBDIRECTORY GROWTH (Fase 37) - a subdirectory can
          # now allocate a second cluster once its first one's 32 entry slots
          # (2 always "."/"..") run out, instead of failing outright. This
          # test creates 31 one-byte files inside a fresh subdirectory - the
          # exact count that forces the 31st to land in a genuinely new
          # cluster - and found a real bug on its first run (a cluster-
          # allocation collision between a new file/directory's own content
          # and a directory's own growth, both calling find_free_clusters
          # before either had committed its choice to the FAT), fixed by
          # reordering find_free_entry_in before find_free_clusters in both
          # create_file_impl and create_directory_impl. last_ok=true is the
          # single strongest proof: it means the 31st file's content
          # genuinely round-tripped through the new cluster, not just that
          # its directory entry happened to exist. All five checks must
          # succeed for this exact line to appear; a fresh CI image always
          # takes this same fully-self-cleaning path.
          grep -q "FAT12\] dir_growth_test all_created=true count_ok=true last_ok=true all_deleted=true cleanup_ok=true" boot.log
          # Confirms VFAT LONG FILE NAMES (Fase 38) - create_file/create_
          # directory now fall back to a real short-alias-plus-long-entry
          # VFAT sequence for a name that doesn't fit 8.3 (here, a 13-
          # character name with an embedded space - this Fase's exact
          # one-chunk boundary). long_name_shown proves parse_dir_sector
          # reconstructs the checksum-verified long name for `ls`;
          # long_name_read_ok AND alias_read_ok both true is the real
          # proof of this Fase's actual scope: find_entry_location_in
          # matches by *either* the long name or the generated short
          # alias, not just whichever one display happens to show.
          # alias_collision_rejected is a direct regression guard for a
          # real bug this test caught on its first run locally - a plain
          # 8.3 name typed directly used to skip collision-checking
          # against an already-generated VFAT alias, letting two entries
          # silently share one short name. Repeated for a directory,
          # deleted by its *long* name this time (the file case above
          # used the alias) to cover both lookup directions across the
          # two sub-tests, not just one. All eleven checks must succeed
          # for this exact line to appear; a fresh CI image always takes
          # this same fully-self-cleaning path.
          grep -q "FAT12\] vfat_test file_created=true long_name_shown=true long_name_read_ok=true alias_read_ok=true alias_collision_rejected=true file_delete_ok=true file_gone_ok=true dir_created=true dir_long_name_shown=true dir_delete_ok=true dir_gone_ok=true" boot.log
          # Confirms MULTI-SEGMENT SHELL PATHS (Fase 39) - touch/cat/rm/
          # mkdir/rmdir/ls now understand "DIR1/DIR2/.../NAME" any number of
          # levels deep, through the REAL dispatch_command parsing path, not
          # by calling Fat12Info's own already-nesting-capable _in methods
          # directly (Fase 36 proved those work; this proves the shell can
          # finally reach them). "mkdir MULTIOUT/MULTIIN -> created" is the
          # key new capability: creating a directory *inside* another one by
          # name, from the shell, for the first time - before this Fase,
          # mkdir/rmdir/ls never split a path at all. The test content is a
          # fixed literal ("nested two levels deep"), so its 22-byte length
          # and first-4-bytes hex are safe to assert exactly, same reasoning
          # as every other fixed-literal-content check. The final cat
          # correctly asserts the subdirectory-specific "not found in
          # directory" message (not "in root directory") - proof the path
          # genuinely routed two levels down, not a coincidental pass.
          # Fully self-cleaning, so this is the only outcome a fresh CI
          # image should ever see.
          grep -q "SHELL\] mkdir MULTIOUT -> created" boot.log
          grep -q "SHELL\] mkdir MULTIOUT/MULTIIN -> created" boot.log
          grep -q "SHELL\] touch MULTIOUT/MULTIIN/DEEP.TXT -> created 22 bytes" boot.log
          grep -q "SHELL\] cat MULTIOUT/MULTIIN/DEEP.TXT -> 22 bytes" boot.log
          grep -q "first4=6e657374" boot.log
          grep -q "SHELL\] ls MULTIOUT/MULTIIN -> 3 entries" boot.log
          grep -q "SHELL\] rm MULTIOUT/MULTIIN/DEEP.TXT -> deleted" boot.log
          grep -q "SHELL\] cat MULTIOUT/MULTIIN/DEEP.TXT -> FAILED: FAT12: file not found in directory" boot.log
          grep -q "SHELL\] rmdir MULTIOUT/MULTIIN -> deleted" boot.log
          grep -q "SHELL\] rmdir MULTIOUT -> deleted" boot.log
          # Confirms MULTI-CHUNK VFAT LONG FILE NAMES (Fase 40) - a name
          # past Fase 38's original 13-character single-entry cap now
          # chains multiple long-name entries instead of being rejected.
          # "a very long descriptive name.txt" is 32 characters, needing
          # ceil(32/13)=3 long entries (13+13+6) - past the boundary, not
          # merely one character over it. long_read_ok AND alias_read_ok
          # both true proves the read side's multi-chunk reconstruction
          # (LfnState, general from the start but never exercised past
          # one chunk until now) actually works, not just that it compiles;
          # deleted by the long name specifically exercises find_entry_
          # location_in's own multi-chunk accumulation the same way.
          # All six checks must succeed for this exact line to appear;
          # a fresh CI image always takes this same fully-self-cleaning
          # path.
          grep -q "FAT12\] multi_chunk_vfat_test created=true shown=true long_read_ok=true alias_read_ok=true delete_ok=true gone_ok=true" boot.log
          # Confirms the ATA PIO sector read got real bytes back, not just
          # that it returned without crashing - 0x55AA is only present at
          # 510-511 if the MBR was actually read correctly.
          grep -q "signature=0x55aa (valid)" boot.log
          # Confirms MBR partition parsing found the real partition entry
          # the bootloader crate lays the kernel binary down in - not just
          # that parse_mbr() ran, but that it read genuine partition data.
          grep -q "type=0x0c (FAT32)" boot.log
          # Our own disk's 0x0C-typed partition is actually formatted
          # FAT12, not FAT32 - confirms the parser's root_entry_count
          # check still correctly detects and rejects that with a clean
          # message, rather than silently misreading FAT12's
          # differently-shaped BPB as FAT32 fields (which is exactly what
          # happened locally before this check existed: a garbage LBA in
          # the billions and a confusing raw ATA error instead).
          grep -q "not FAT32 (root_entry_count" boot.log
          # Confirms the FAT12 fallback actually parsed the fixed-location
          # root directory and found all 3 real files on this disk (the
          # two bootloader stages + the kernel binary itself) - not just
          # that fat12::read_bpb() ran without erroring. Deliberately NOT
          # asserting exact byte counts here: a first run of this exact
          # check (hardcoded to the local build's 132992-byte KERNEL~1)
          # failed on the CI runner, which produced a KERNEL~1 of 132960
          # bytes from the same source - the kernel ELF's own size isn't
          # stable across build machines (e.g. absolute source paths of
          # differing length end up embedded in panic/debug strings), so
          # pinning an exact size here would make this check flaky by
          # construction rather than a real regression guard.
          grep -q "FAT12/16 3 entries" boot.log
          grep -q "KERNEL~1" boot.log
          # Confirms `cat` walked the FAT12 cluster chain (starting at
          # cluster 268, per the ls listing above) and read the file back
          # successfully. first4=7f454c46 is the real ELF magic number
          # (\x7fELF) - unlike the byte count, this 4-byte prefix IS a
          # build-independent invariant (every valid ELF starts with it
          # regardless of the file's total size), making it the strongest
          # portable evidence available that the bytes read off disk are
          # genuinely the kernel's own binary.
          grep -q "SHELL\] cat KERNEL~1 ->" boot.log
          grep -q "first4=7f454c46" boot.log
          echo "All expected boot milestones found."
