          grep -q "SHELL\] mkdir MULTIOUT -> created" boot.log
          grep -q "SHELL\] mkdir MULTIOUT/MULTIIN -> created" boot.log
          grep -q "SHELL\] touch MULTIOUT/MULTIIN/DEEP.TXT -> created 22 bytes" boot.log
          grep -q "SHELL\] cat MULTIOUT/MULTIIN/DEEP.TXT -> 22 bytes" boot.log
          grep -q "first4=6e657374" boot.log
          grep -q "SHELL\] ls MULTIOUT/MULTIIN -> 3 entries" boot.log
          grep -q "SHELL\] rm MULTIOUT/MULTIIN/DEEP.TXT -> deleted" boot.log
          grep -q "SHELL\] cat MULTIOUT/MULTIIN/DEEP.TXT -> FAILED: FAT12: file not found in directory" boot.log
          grep -q "SHELL\] rmdir MULTIOUT/MULTIIN -> deleted" boot.log
          grep -q "SHELL\] rmdir MULTIOUT -> deleted" boot.log
          # Confirms MULTI-CHUNK VFAT LONG FILE NAMES (Fase 40) - a name
          # past Fase 38's original 13-character single-entry cap now
          # chains multiple long-name entries instead of being rejected.
          # "a very long descriptive name.txt" is 32 characters, needing
          # ceil(32/13)=3 long entries (13+13+6) - past the boundary, not
          # merely one character over it. long_read_ok AND alias_read_ok
          # both true proves the read side's multi-chunk reconstruction
          # (LfnState, general from the start but never exercised past
          # one chunk until now) actually works, not just that it compiles;
          # deleted by the long name specifically exercises find_entry_
          # location_in's own multi-chunk accumulation the same way.
          # All six checks must succeed for this exact line to appear;
          # a fresh CI image always takes this same fully-self-cleaning
          # path.
          grep -q "FAT12\] multi_chunk_vfat_test created=true shown=true long_read_ok=true alias_read_ok=true delete_ok=true gone_ok=true" boot.log
          # Fase 139: confirms fat_common::short_entry_if_matches - the
          # shared helper fat12.rs::find_entry_location_in was refactored
          # to call instead of its own inline duplicate, and that
          # fat32.rs::find_entry (new this Fase) also calls to fix a real
          # gap (fat32.rs::read_file could never find a file by its short
          # name once it also had a long one, unlike fat12.rs's own
          # already-correct behavior proven by the two alias_read_ok
          # assertions above). Disk-independent: hand-built raw VFAT
          # entries prove a lookup succeeds by EITHER name and correctly
          # fails when neither matches - fat32.rs's own cluster-walking
          # integration around this shared logic remains unexercised by
          # this project's real disk image (genuine FAT12 mislabeled
          # FAT32, always rejected by fat32::read_bpb).
          grep -q "FAT\] short_entry_if_matches_test by_long_name_ok=true by_short_name_ok=true mismatch_rejected=true" boot.log
          # Fase 148: fat12.rs::build_dir_entry has stamped a real CMOS-
          # RTC-derived timestamp into every file's on-disk directory
          # entry since Fase 20, but nothing anywhere in this tree ever
          # read those bytes back until fat_common::DirEntry gained
          # fat_time/fat_date fields this Fase - the same "write-only,
          # never wired to a real reader" gap Fase 136/137/138/143/147
          # already found and closed elsewhere, just never previously
          # found in the FAT code. Brackets the real file creation with
          # an RTC read immediately before AND after (matches_bracket
          # accepts either), rather than exact equality against one
          # arbitrary sample, so a second/minute/hour boundary ticking
          # over mid-test can't make this flaky.
          grep -q "FAT12\] timestamp_roundtrip_test created=true matches_bracket=true delete_ok=true" boot.log
          # Confirms the ATA PIO sector read got real bytes back, not just
          # that it returned without crashing - 0x55AA is only present at
          # 510-511 if the MBR was actually read correctly.
          grep -q "signature=0x55aa (valid)" boot.log
          # Confirms MBR partition parsing found the real partition entry
          # the bootloader crate lays the kernel binary down in - not just
          # that parse_mbr() ran, but that it read genuine partition data.
          grep -q "type=0x0c (FAT32)" boot.log
          # Our own disk's 0x0C-typed partition is actually formatted
          # FAT12, not FAT32 - confirms the parser's root_entry_count
          # check still correctly detects and rejects that with a clean
          # message, rather than silently misreading FAT12's
          # differently-shaped BPB as FAT32 fields (which is exactly what
          # happened locally before this check existed: a garbage LBA in
          # the billions and a confusing raw ATA error instead).
          grep -q "not FAT32 (root_entry_count" boot.log
          # Confirms the FAT12 fallback actually parsed the fixed-location
          # root directory and found all 3 real files on this disk (the
          # two bootloader stages + the kernel binary itself) - not just
          # that fat12::read_bpb() ran without erroring. Deliberately NOT
          # asserting exact byte counts here: a first run of this exact
          # check (hardcoded to the local build's 132992-byte KERNEL~1)
          # failed on the CI runner, which produced a KERNEL~1 of 132960
          # bytes from the same source - the kernel ELF's own size isn't
          # stable across build machines (e.g. absolute source paths of
          # differing length end up embedded in panic/debug strings), so
          # pinning an exact size here would make this check flaky by
          # construction rather than a real regression guard.
          grep -q "FAT12/16 3 entries" boot.log
          grep -q "KERNEL~1" boot.log
          # Confirms `cat` walked the FAT12 cluster chain (starting at
          # cluster 268, per the ls listing above) and read the file back
          # successfully. first4=7f454c46 is the real ELF magic number
          # (\x7fELF) - unlike the byte count, this 4-byte prefix IS a
          # build-independent invariant (every valid ELF starts with it
          # regardless of the file's total size), making it the strongest
          # portable evidence available that the bytes read off disk are
          # genuinely the kernel's own binary.
          grep -q "SHELL\] cat KERNEL~1 ->" boot.log
          grep -q "first4=7f454c46" boot.log
          echo "All expected boot milestones found."
