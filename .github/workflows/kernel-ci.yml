name: kernel-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain (channel/components/target) comes from each crate's own
      # rust-toolchain.toml (both now list clippy+rustfmt too) - rustup
      # auto-installs it on first use, so this stays in sync with local
      # dev by construction instead of duplicating the pin here.
      - name: Lint agentos-kernel (fmt + clippy)
        working-directory: agentos-kernel
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

      - name: Lint kernel-runner (fmt + clippy)
        working-directory: kernel-runner
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

      - name: Build agentos-kernel
        working-directory: agentos-kernel
        run: cargo build --release

      # Separate host-target crate (its own rust-toolchain.toml) that
      # packages the kernel ELF into a bootable disk image via the
      # `bootloader` crate's DiskImageBuilder.
      - name: Build kernel-runner and package a bootable disk image
        working-directory: kernel-runner
        run: |
          cargo build --release
          ./target/release/kernel-runner \
            "../agentos-kernel/target/x86_64-unknown-none/release/agentos-kernel" \
            "../agentos-kernel/target/disk-image"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      # Boots headlessly and greps the serial log for milestones from
      # across every phase of the kernel (exceptions, PIC/interrupts, the
      # shell dispatcher, the cooperative and preemptive schedulers) - a
      # real smoke test, not just "did it compile". `|| true` on the qemu
      # invocation because `timeout` exits non-zero when it has to kill
      # the still-running kernel, which is the expected/healthy outcome
      # (the kernel's idle loop never exits on its own). 25s (not 15s) to
      # leave margin for the preemptive demo's ~2.7s real timer wait on
      # top of everything before it, especially on a possibly slower/
      # nested-virtualized CI runner than local dev hardware.
      #
      # Fase 90: bumped 25s -> 35s. The RX-rearm fix made tcp_echo_test's
      # own real network round trip (SYN/SYN-ACK/ACK/data/echo, each a
      # real wait) actually succeed instead of silently failing fast -
      # genuine progress, but real work that real hardware/network I/O
      # takes real time for, and it lands late in the boot sequence,
      # right before `priority_test`'s own ~2.7s real timer wait. One CI
      # run (30733524477) confirmed the fix itself works (`tcp_echo_test
      # ... echo_matches=true`) but then ran out of the old 25s budget
      # mid-`priority_test`, cut off by wall-clock time, not a real
      # regression - confirmed locally: 35s lets `priority_test` finish
      # completely with room to spare, unlike 25s.
      #
      # Fase 108: bumped 35s -> 45s. Adds a SECOND, sequential real tcp_
      # echo_test call (net::e1000::tcp_echo_test itself unchanged) -
      # roughly doubling the same class of real wall-clock cost the
      # 25s->35s bump above already accounted for once: a genuine real
      # network round trip that lands late in the boot sequence, right
      # before priority_test's own real timer wait. Confirmed locally
      # first, the same way as the earlier bump: a clean boot at the old
      # 35s-equivalent margin cut off mid-way through the ring3_mt-family
      # tests (priority_mt_test onward), cut off by wall-clock time, not
      # a real regression - 45s lets every later test finish completely
      # with room to spare.
      #
      # Fase 82: e1000 and virtio-net-pci now each get their own EXPLICIT
      # `-netdev user`, replacing the single bare `-device virtio-net-pci`
      # (which relied on QEMU's one implicit default netdev, always
      # claimed by e1000, leaving virtio-net-pci with no backend at all -
      # confirmed and left this way deliberately since Fase 78, back when
      # doing so wouldn't have flipped any test to a pass anyway). Making
      # e1000 explicit now that virtio-net-pci's own second-round-trip
      # test (Fase 82's own fix) genuinely needs a real backend to be
      # verifiable in CI at all - verified locally first (3 repeated
      # boots under this exact dual-netdev config, full 110-assertion
      # regression suite unchanged, e1000's own PCI slot/MAC/every
      # existing e1000 test untouched) before trusting this change here.
      # Fase 90: a real packet capture on the e1000 netdev, kept as
      # standing CI infrastructure (not a one-off) - the same `-object
      # filter-dump` technique has now been the decisive tool THREE
      # times in this kernel's history (the VirtIO RX mystery, Fase 89's
      # own MSS/padding bug, and the RX-rearm bug this same Fase found
      # in CI specifically - a genuinely CI-only failure that never
      # reproduced locally). Uploaded unconditionally (`if: always()` on
      # the next step) so it's available for the NEXT time this area
      # needs real evidence instead of a guess, without needing another
      # push-and-wait round trip just to add the capture back.
      - name: Boot-test in QEMU
        run: |
          timeout 45 qemu-system-x86_64 \
            -drive format=raw,file=agentos-kernel/target/disk-image/agentos-bios.img \
            -serial stdio -display none -no-reboot -no-shutdown \
            -netdev user,id=e1000net,guestfwd=tcp:10.0.2.100:9999-cmd:cat -device e1000,netdev=e1000net \
            -object filter-dump,id=e1000dump,netdev=e1000net,file=e1000.pcap \
            -netdev user,id=virtionet -device virtio-net-pci,netdev=virtionet \
            | tee boot.log || true
          echo "----- full boot.log -----"
          cat boot.log
          echo "--------------------------"

      - name: Upload packet capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e1000-pcap
          path: e1000.pcap
          retention-days: 5

      - name: Verify the serial trace
        run: |
          grep -q "AgentOS Native Bare-Metal Kernel Initialized" boot.log
          # Confirms the ring-3 GDT/TSS foundation (Fase 68, the first
          # step of a real usermode transition arc) - real ring-3 code/
          # data segments now exist in the GDT and the TSS has a real
          # kernel stack (RSP0) ready for a future ring-3->ring-0
          # control transfer. user_code_rpl_ok/user_data_rpl_ok=true is
          # genuine proof these selectors' own Requested Privilege
          # Level bits are really Ring 3, not just "some selector got
          # appended" - a wrong descriptor would show rpl=0 instead.
          # rsp0_nonzero=true confirms a real stack was installed, not
          # the TSS's own zeroed default (an instant triple fault the
          # moment it was ever actually used). Does NOT yet mean ring-3
          # code can run - no IDT gate has DPL=3, no page is user-
          # accessible, nothing performs the actual iretq/sysret
          # transition yet - that's real, separate follow-on work.
          grep -q "GDT\] ring3_test user_code_selector=0x002b user_data_selector=0x0023 user_code_rpl_ok=true user_data_rpl_ok=true rsp0_nonzero=true" boot.log
          grep -q "\[IDT\] Native IDT Loaded" boot.log
          grep -q "\[EXCEPTION\] Breakpoint" boot.log
          # Confirms the real DPL=3 syscall gate (Fase 69, the second
          # step of the ring-3 arc after Fase 68's own GDT/TSS
          # foundation) - `int 0x80` (the classic Unix/Linux software-
          # interrupt syscall vector) is fired for real right now, from
          # ring-0 (no ring-3 code exists yet, but CPL=0 <= DPL=3 is
          # always a permitted invocation, so this already proves the
          # gate is real and correctly wired, not just that its DPL
          # bits read back as 3 in isolation). count_delta=1 is genuine
          # proof the handler ran exactly once - not a coincidental
          # read of an already-nonzero counter, and not a silently
          # swallowed fault.
          # dispatch_ret=0 (Fase 72) strengthens this same check: the
          # gate is no longer a trivial counter bump - `int 0x80` now
          # runs through a hand-written `#[unsafe(naked)]` entry stub
          # (syscall_entry_asm) that reads the real RAX/RDI/RSI/RDX this
          # ring-0 self-test explicitly pins (SYS_SERIAL_PRINT, 0, 0, 0)
          # and dispatches to the real syscall::dispatch_syscall, whose
          # real return value (0) comes back correctly in RAX across the
          # full round trip - not the old extern "x86-interrupt" handler,
          # which never had register access at all (see interrupts.rs's
          # own doc for why that ABI can't provide it).
          grep -q "IDT\] syscall_int_test count_delta=1 dispatch_ret=0" boot.log
          # Confirms the syscall entry stub now reads the CALLER's own
          # privilege level for real (Fase 75) - the CPU's own interrupt
          # frame (pushed before syscall_entry_asm's own 15 registers,
          # so it sits at a fixed, hand-verified offset above them)
          # always has CS as its 2nd field, regardless of whether this
          # was a same-privilege or privilege-elevating entry; its low 2
          # bits are the real Requested Privilege Level at the moment
          # `int 0x80` fired. caller_rpl=0 here is this exact ring-0
          # self-test's own call (the line right above), genuinely
          # distinct from the SEPARATE caller_rpl=3 line below (from
          # run_ring3_exit_test's own real ring-3 call) - proof this
          # correctly distinguishes the two, not a hardcoded constant.
          # Deliberately does not yet change any syscall's behavior
          # based on this value - see interrupts.rs's own doc for why.
          grep -q "SYSCALL\] real_syscall_from_ring3 sys_nr=1 arg1=0 caller_rpl=0 returned=0" boot.log
          grep -q "\[PIC\] 8259 remapped to vectors 32-47" boot.log
          # Confirms a real, dedicated user-accessible page mapping
          # (Fase 70, the third step of the ring-3 arc after Fase 68's
          # GDT/TSS foundation and Fase 69's DPL=3 int 0x80 gate) -
          # deliberately a NEW mapping (0x5555_5555_0000), not the heap
          # (which stays kernel-only), verified checked-not-assumed to
          # share no page-table level with the heap's own range before
          # any code was written (PML4 index 170 vs. 136), so the
          # x86_64 crate's own automatic parent_table_flags derivation
          # in map_to creates fresh, correctly USER_ACCESSIBLE
          # intermediate tables rather than inheriting the heap's
          # stale, non-user-accessible ones - a real, easy-to-miss
          # correctness subtlety, since x86_64 ANDs the effective
          # permission across every page-table level, not just the
          # leaf. Verified two independent ways: user_accessible=true
          # is the real leaf PTE flag read back through the page
          # tables (via Translate, not just trusting map_to's own Ok
          # return), and write_read_back_ok=true is a real byte-
          # pattern write+read-back through the mapping (ring-0 can
          # freely access a USER_ACCESSIBLE page too - that bit only
          # ever restricts ring-3). Still entirely a ring-0 operation -
          # nothing runs in ring-3 yet to prove the bit makes an actual
          # difference, that's separate, substantial follow-on work.
          grep -q "MEMORY\] user_page_test present=true writable=true user_accessible=true write_read_back_ok=true" boot.log
          # Fase 99: a SECOND, independent user page (USER_DISK_PROGRAM_
          # PAGE_ADDR, PML4 index 204 - distinct from both the heap's
          # 136 and the test page's own 170 above, checked the same way
          # before writing any code). Verified the same two independent
          # ways as the page above. Exists so a ring-3 program can run
          # on its own memory instead of sharing the one page every
          # other ring-3 test also uses - see the disk_loaded_test
          # assertion below, now repointed at this address.
          grep -q "MEMORY\] disk_program_page present=true writable=true user_accessible=true write_read_back_ok=true" boot.log
          # Fase 100: a THIRD independent page (USER_DISK_PROGRAM_STACK_
          # ADDR, PML4 index 238 - distinct from the heap's 136, the
          # test page's 170, and the disk program page's own 204).
          # A dedicated stack for the same disk-loaded program, so its
          # code and stack no longer share a page's tail - every ring-3
          # test before this one kept stack_top at code_addr + 4096.
          # See the disk_loaded_test assertion below: exit_code=42
          # unchanged proves enter_ring3's iretq frame works correctly
          # even when code and stack live on genuinely separate pages.
          grep -q "MEMORY\] disk_program_stack present=true writable=true user_accessible=true write_read_back_ok=true" boot.log
          # Fase 103: a FOURTH independent page (USER_DISK_PROGRAM_DATA_
          # ADDR, PML4 index 102 - distinct from the heap's 136, the
          # test page's 170, the disk program page's own 204, and the
          # disk program stack's own 238). A real DATA segment for the
          # same disk-loaded program - every ring-3 program in this
          # kernel's history has only ever had code and (since Fase 100)
          # a stack, never a third region to read or write. See the
          # disk_loaded_test assertion below: data_write_verified=true
          # proves the disk-loaded program's own `mov r12, imm64` +
          # `mov [r12], al` (the same encoding build_coop_task_prologue
          # already proved correct) genuinely wrote to this page, not
          # just that the mapping itself looks right in isolation.
          grep -q "MEMORY\] disk_program_data present=true writable=true user_accessible=true write_read_back_ok=true" boot.log
          # Confirms a SAFE ring-3 -> ring-0 return (Fase 73) - unlike
          # ring3test/ring3syscall above (both deliberately opt-in, not
          # asserted here, since both end in a permanent halt by
          # design), this one genuinely resumes normal kernel execution
          # afterward, so it runs unconditionally and IS asserted here
          # like any other Fase. exit_code=42 is the value the ring-3
          # program itself set via `mov eax, 42` right before `int 0x81`
          # - direct proof this specific value made a full round trip
          # from a real ring-3 program, through a hand-written naked
          # asm stub that switches to a previously-saved kernel stack
          # instead of resuming ring-3, back into a normal Rust function
          # call's own return value - not a coincidence or a hardcoded
          # default. The FRAME ALLOC check below is the real regression
          # guard for "did the kernel actually keep running afterward":
          # it is the very next self-test in main()'s own sequence, so
          # its presence here already proves execution didn't stop.
          grep -q "RING3\] ring3_exit_test exit_code=42" boot.log
          # Confirms this exact ring-3 program's own real int 0x80 (the
          # `mov eax,1` step, before it goes on to exit via 0x81) reads
          # back caller_rpl=3 (Fase 75) - the OTHER half of the check
          # above this same file's own ring-0 self-test line: same
          # mechanism, genuinely different result, because the CPU's own
          # CS.RPL genuinely was different at each call site.
          grep -q "SYSCALL\] real_syscall_from_ring3 sys_nr=1 arg1=.* caller_rpl=3 returned=0" boot.log
          # Fase 71 (the actual ring-0 -> ring-3 transition, `ring3.rs`)
          # is deliberately NOT asserted here, unlike every other Fase -
          # not an oversight. Its own shell command (`ring3test`) ends in
          # a permanent, intentional halt (the strongest available proof
          # ring-3 genuinely cannot execute a privileged instruction like
          # `cli`), so invoking it unconditionally in this SAME shared
          # boot-test flow would either break real interactive use (if
          # invoked before the shell prompt) or prevent this flow's own
          # remaining checks below from ever running (if invoked after).
          # Verified instead via a real, repeatable LOCAL test (3x,
          # temporarily invoked, since removed before commit) - see
          # ring3.rs's own module doc and README.md's GDT/IDT row for
          # the full verification story and reasoning.
          # Fase 72 (a real ring-3-originated syscall, ring3.rs's own
          # run_ring3_syscall_test / the `ring3syscall` shell command)
          # is, for the exact same reason, ALSO deliberately NOT
          # asserted here - it too ends in the same permanent, expected
          # halt (a real int-0x80 round trip first, then the same
          # deliberate `cli` fault as ring3test). Verified the same way:
          # a real, repeatable LOCAL test (3x, byte-for-byte identical
          # results), temporarily invoked, since removed before commit.
          # Confirms the global frame allocator hands out real, distinct,
          # genuinely writable/readable physical frames (verified=true is
          # only printed if all 3 write/read-back checks passed - a
          # mismatch would have panicked the boot instead). Not asserting
          # the exact addresses: they depend both on the bootloader's own
          # memory-map detection (could vary by QEMU/firmware version,
          # like Fase 19's BAR0 finding) and on how many earlier frames
          # the kernel image + heap already consumed (could vary by build
          # machine, like Fase 15's ELF-size finding) - so instead this
          # checks the one thing that's actually invariant: consecutive
          # allocate_frame() calls must return frames exactly 4 KiB apart,
          # which is a property of the allocator's own walk order, not of
          # where in physical memory it happens to start from.
          grep -q "FRAME ALLOC\].*verified=true" boot.log
          frame_line=$(grep "FRAME ALLOC\]" boot.log)
          mapfile -t frame_addrs < <(echo "$frame_line" | grep -oE "0x[0-9a-f]+")
          if [ "${#frame_addrs[@]}" -ne 3 ]; then
            echo "FRAME ALLOC REGRESSION: expected 3 addresses in '$frame_line', found ${#frame_addrs[@]}."
            exit 1
          fi
          if [ $(( ${frame_addrs[1]} - ${frame_addrs[0]} )) -ne 4096 ] || [ $(( ${frame_addrs[2]} - ${frame_addrs[1]} )) -ne 4096 ]; then
            echo "FRAME ALLOC REGRESSION: frames aren't consecutive 4 KiB apart: ${frame_addrs[*]}."
            exit 1
          fi
          # Confirms the GGUF header parser's input now genuinely round-trips
          # through the FAT12 disk (Fase 41) - create_file writes the same
          # 24-byte sample header to a real file, read_file reads it back,
          # and round_trip_ok=true means those bytes matched byte-for-byte -
          # not just that parse_header ran, which it always could on a
          # hardcoded array regardless of whether disk I/O worked at all.
          # Extended (Fase 42) to cover the tensor *weight values* too, and
          # again (Fase 43) to insert a real tensor-info entry (length-
          # prefixed name, dimensions, quantization type, and a byte OFFSET
          # to that tensor's own data) between the header and the weight
          # bytes. tensor_info_ok=true means the parsed name/dimensions/
          # gtype/offset all match what was actually written - not just
          # that GgufTensorInfo::parse ran without erroring. weights_
          # decoded_ok=true means decode_f32_le, given the bytes at that
          # PARSED offset (not an assumed fixed position), reproduced the
          # exact original values - the real proof the offset-based
          # indirection works, not just parses. tensor_output_ok=true means
          # running the matmul on those offset-located, disk-decoded
          # weights produces the same known-correct result the original
          # hardcoded array always did.
          grep -q "GGUF\] disk_load_test write_ok=true round_trip_ok=true tensor_info_ok=true weights_decoded_ok=true tensor_output_ok=true cleanup_ok=true" boot.log
          # Confirms real GGUF Q8_0 quantized tensor decoding (Fase 50) -
          # pure byte-transformation logic, deliberately disk-independent.
          # f16_vectors_ok is hand-computed (bit patterns 0x3C00/0xC000/
          # 0x0000/0x0001 -> 1.0/-2.0/0.0/the smallest binary16 subnormal),
          # independent of decode_q8_0's own round trip - a round-trip-
          # only test would still pass even if f16_to_f32 consistently
          # disagreed with the real IEEE 754 standard. dispatch_*_ok prove
          # decode_tensor actually branches on a tensor's gtype (F32,
          # Q8_0, and an honest Err for an unimplemented one) rather than
          # silently assuming everything is F32, the real gap this Fase
          # closes.
          grep -q "GGUF\] q8_0_test f16_vectors_ok=true q8_0_decode_ok=true dispatch_f32_ok=true dispatch_q8_0_ok=true" boot.log
          # Confirms real GGUF Q4_0 quantized tensor decoding (Fase 52) -
          # 4-bit, nibble-packed. The self-test's block uses a
          # deliberately asymmetric nibble pattern (low nibble ascending,
          # high nibble descending) specifically so a low/high-nibble
          # swap OR an interleaved-vs-split-half packing bug (byte j's
          # nibbles are value[j]/value[j+16], NOT value[2j]/value[2j+1] -
          # verified against GGML's actual dequantize_row_q4_0 source)
          # would produce a completely different, easily-distinguishable
          # wrong sequence rather than accidentally passing.
          # dispatch_q4_0_ok confirms decode_tensor (Fase 50) now routes
          # Q4_0 to this new decoder too.
          grep -q "GGUF\] q4_0_test q4_0_decode_ok=true dispatch_q4_0_ok=true" boot.log
          # Confirms real GGUF Q4_1 quantized tensor decoding (Fase 53) -
          # closes out the legacy quantization thread (every GgufGtype
          # except F16 now has a real decoder). Same split-half nibble
          # packing as Q4_0, verified to genuinely carry over via GGML's
          # actual dequantize_row_q4_1 source, but a full affine
          # nibble*scale+min dequantization instead of Q4_0's fixed
          # symmetric range. scale=0.5/min=1.0 are deliberately distinct
          # nonzero values so a bug conflating or dropping either field
          # produces visibly wrong output, combined with the same
          # asymmetric nibble pattern Q4_0's own test uses.
          grep -q "GGUF\] q4_1_test q4_1_decode_ok=true dispatch_q4_1_ok=true" boot.log
          # Confirms real GGUF Q4_K super-block decoding (Fase 57) - a
          # 144-byte block holding 256 values across 8 sub-blocks, each
          # with its own 6-bit-packed scale+min (get_scale_min_k4).
          # get_scale_min_k4_ok re-runs a hand-derived-and-verified round
          # trip (an early research fetch of this struct's field sizes
          # was wrong - scales[8]/qs[64] instead of the real scales[12]/
          # qs[128] - so this function's own bit-packing was independently
          # hand-checked, not just re-fetched and trusted). decode_q4_k_ok
          # checks all 256 decoded values (4 distinct 32-byte qs chunks)
          # against 8 hand-computed constants covering every sub-block.
          # Confirms real GGUF Q3_K super-block decoding (Fase 60) - the
          # fourth K-quant format, structurally the most intricate yet:
          # 16 sub-blocks of 16 elements (not 8 of 32), a signed 3-bit
          # value (2 bits from qs + 1 bit from hmask, recentered -4),
          # and a scale-reconstruction scheme that is NOT get_scale_
          # min_k4 (no separate min field - GGML treats scales[12] as
          # three u32 words and SWAR-reconstructs a fourth). The
          # reduced per-index formula was cross-checked by re-
          # implementing GGML's exact packed-word logic in a scratch
          # script across 2000 random byte inputs before any Rust was
          # written - the full value-extraction loop was verified the
          # same way, not just hand arithmetic.
          # Confirms real GGUF Q2_K super-block decoding (Fase 61) - the
          # fifth K-quant format, and the simplest of the intricate
          # K-quant family: each scales[16] byte holds both a scale
          # (low nibble) and min (high nibble) directly, no bit-packing
          # to derive. The plain 2-bit value (unsigned, no recentering)
          # is dequantized affinely - the outer n/j/is/shift loop is
          # structurally identical to Q3_K's own. Verified via the same
          # scratch-script cross-check Q3_K introduced (16 distinct
          # scale/min pairs, spanning the full nibble range) before any
          # Rust was written. Likely completes the real, model-storage
          # K-quant family (Q2_K through Q6_K) - only Q8_K remains, an
          # internal computation format rather than a storage one.
          grep -q "GGUF\] q2_k_test decode_q2_k_ok=true dispatch_q2_k_ok=true" boot.log
          # Confirms real GGUF Q8_K super-block decoding (Fase 67) - the
          # LAST defined K-quant, and despite that, structurally the
          # SIMPLEST of the whole family: no bit-packing at all (qs is
          # a full signed byte per value), and a plain 4-byte f32 delta
          # (not the 2-byte f16 every other K-quant uses) - GGML's own
          # comment marks this format as "only used for intermediate
          # quantization and dot products", not real model storage,
          # explaining both differences (quantizing float activations
          # on the fly wants speed, not the extra compression a
          # sub-block scale/min scheme or a smaller f16 delta would
          # give). qs[i]=i as u8 for all 256 values exhaustively
          # exercises the entire i8 range exactly once (0..127 stay
          # positive, 128..255 wrap to -128..-1) - a stronger check than
          # any other decoder's hand-picked sample set. This completes
          # every GgufGtype this kernel recognizes (F32/F16/Q4_0/Q4_1/
          # Q8_0/Q2_K through Q6_K/Q8_K) - decode_tensor now has a real
          # decoder for every defined type, no unimplemented gtype left.
          grep -q "GGUF\] q8_k_test decode_q8_k_ok=true dispatch_q8_k_ok=true" boot.log
          grep -q "GGUF\] q3_k_test decode_q3_k_ok=true dispatch_q3_k_ok=true" boot.log
          grep -q "GGUF\] q4_k_test get_scale_min_k4_ok=true decode_q4_k_ok=true dispatch_q4_k_ok=true" boot.log
          # Confirms real GGUF Q6_K super-block decoding (Fase 58) - a
          # 210-byte block (ql[128]+qh[64]+scales[16]+d, d LAST unlike
          # every format above) holding 256 values whose 6-bit quantized
          # value is split across TWO arrays (ql low nibble, qh 2-bit
          # field) rather than one nibble-pair array, with plain signed
          # i8 sub-block scales (no bit-packing, unlike Q4_K's scales).
          # decode_q6_k_ok checks all 256 decoded values from a uniform
          # ql/qh byte pattern against 8 distinct prime-scaled hand-
          # computed constants, exercising both branches of the sub-
          # block scale index for all four bit-extracted quadrants.
          grep -q "GGUF\] q6_k_test decode_q6_k_ok=true dispatch_q6_k_ok=true" boot.log
          # Confirms real GGUF Q5_K super-block decoding (Fase 59) - a
          # third K-quant format, structurally close to Q4_K (d/dmin
          # first, scales[12] 6-bit-packed via the SAME get_scale_min_k4
          # Q4_K already uses, unchanged). The new piece: a 5th bit per
