name: kernel-ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Toolchain (channel/components/target) comes from each crate's own
      # rust-toolchain.toml (both now list clippy+rustfmt too) - rustup
      # auto-installs it on first use, so this stays in sync with local
      # dev by construction instead of duplicating the pin here.
      - name: Lint agentos-kernel (fmt + clippy)
        working-directory: agentos-kernel
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

      - name: Lint kernel-runner (fmt + clippy)
        working-directory: kernel-runner
        run: |
          cargo fmt --check
          cargo clippy --release -- -D warnings

      - name: Build agentos-kernel
        working-directory: agentos-kernel
        run: cargo build --release

      # Separate host-target crate (its own rust-toolchain.toml) that
      # packages the kernel ELF into a bootable disk image via the
      # `bootloader` crate's DiskImageBuilder.
      - name: Build kernel-runner and package a bootable disk image
        working-directory: kernel-runner
        run: |
          cargo build --release
          ./target/release/kernel-runner \
            "../agentos-kernel/target/x86_64-unknown-none/release/agentos-kernel" \
            "../agentos-kernel/target/disk-image"

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      # Boots headlessly and greps the serial log for milestones from
      # across every phase of the kernel (exceptions, PIC/interrupts, the
      # shell dispatcher, the cooperative and preemptive schedulers) - a
      # real smoke test, not just "did it compile". `|| true` on the qemu
      # invocation because `timeout` exits non-zero when it has to kill
      # the still-running kernel, which is the expected/healthy outcome
      # (the kernel's idle loop never exits on its own). 25s (not 15s) to
      # leave margin for the preemptive demo's ~2.7s real timer wait on
      # top of everything before it, especially on a possibly slower/
      # nested-virtualized CI runner than local dev hardware.
      - name: Boot-test in QEMU and verify the serial trace
        run: |
          timeout 25 qemu-system-x86_64 \
            -drive format=raw,file=agentos-kernel/target/disk-image/agentos-bios.img \
            -serial stdio -display none -no-reboot -no-shutdown \
            | tee boot.log || true
          echo "----- full boot.log -----"
          cat boot.log
          echo "--------------------------"
          grep -q "AgentOS Native Bare-Metal Kernel Initialized" boot.log
          grep -q "\[IDT\] Native IDT Loaded" boot.log
          grep -q "\[EXCEPTION\] Breakpoint" boot.log
          grep -q "\[PIC\] 8259 remapped to vectors 32-47" boot.log
          grep -q "SHELL\] ps ->" boot.log
          grep -q "\[CTXSWITCH\] worker -> main: demo OK" boot.log
          grep -q "\[COOP\] all tasks finished" boot.log
          grep -q "\[PREEMPT\] task0=" boot.log
          # Regression guard for the exact bug this demo caught locally:
          # both counters at exactly 0 means the timer-forced switches
          # never really happened (e.g. a non-atomic flag/counter got
          # optimized away again), not that preemption is merely slow.
          if grep -q "\[PREEMPT\] task0=0 task1=0" boot.log; then
            echo "PREEMPT REGRESSION: both counters are zero - neither task ever ran."
            exit 1
          fi
          # device=0x1237 is the real i440FX host bridge's device ID -
          # always present at 00:00.0 on QEMU's default machine, so this
          # confirms PCI config-space reads are actually correct, not just
          # that the lspci command ran without crashing.
          grep -q "device=0x1237" boot.log
          # Confirms the ATA PIO sector read got real bytes back, not just
          # that it returned without crashing - 0x55AA is only present at
          # 510-511 if the MBR was actually read correctly.
          grep -q "signature=0x55aa (valid)" boot.log
          # Confirms MBR partition parsing found the real partition entry
          # the bootloader crate lays the kernel binary down in - not just
          # that parse_mbr() ran, but that it read genuine partition data.
          grep -q "type=0x0c (FAT32)" boot.log
          # Our own disk's 0x0C-typed partition is actually formatted
          # FAT12, not FAT32 - confirms the parser's root_entry_count
          # check still correctly detects and rejects that with a clean
          # message, rather than silently misreading FAT12's
          # differently-shaped BPB as FAT32 fields (which is exactly what
          # happened locally before this check existed: a garbage LBA in
          # the billions and a confusing raw ATA error instead).
          grep -q "not FAT32 (root_entry_count" boot.log
          echo "All expected boot milestones found."
